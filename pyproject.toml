[project]
name = "justitie-mcp"
version = "0.1.0"
description = "Server MCP pentru datele publice ale instantelor din Romania (portal.just.ro): dosare, parti, termene, solutii, sedinte"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10,<2",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
justitie-mcp = "justitie_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/justitie_mcp"]
