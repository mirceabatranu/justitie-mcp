[project]
name = "justitie-mcp"
version = "0.3.0"
description = "Server MCP pentru instantele (portal.just.ro), legislatia consolidata (legislatie.just.ro) si registrele MJ (data.gov.ro) din Romania"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10,<2",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
justitie-mcp = "justitie_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/justitie_mcp"]
